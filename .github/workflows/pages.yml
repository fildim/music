name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The app has no dependencies, so there is nothing to install — but a
      # broken build should never reach the published site.
      - name: Run tests
        run: npm test

      - name: Build the single-file bundle
        run: node build.js

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets src examples _site/
          # A self-contained copy people can save and open offline.
          cp dist/index.html _site/standalone.html
          touch _site/.nojekyll

      # One-time manual step, because the workflow's own token is not allowed
      # to create a Pages site: in the repository, open
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
